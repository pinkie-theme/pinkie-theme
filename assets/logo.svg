<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="190" />
    </clipPath>
  </defs>

  <!-- Circular Pastel Pink Background -->
  <circle cx="200" cy="200" r="190" fill="#F7ADC7" />

  <!-- Bunny Silhouette (Clipped to Circle) -->
  <g clip-path="url(#circleClip)">
    <!-- Shoulders & Body extending to bottom -->
    <path d="M 85 400 C 105 330 145 310 200 310 C 255 310 295 330 315 400 Z" fill="#FFFFFF" />

    <!-- Left Ear -->
    <path d="M 132 200 C 122 130 128 65 158 65 C 188 65 194 130 184 200 Z" fill="#FFFFFF" />

    <!-- Right Ear -->
    <path d="M 216 200 C 206 130 212 65 242 65 C 272 65 278 130 268 200 Z" fill="#FFFFFF" />

    <!-- Chubby Head -->
    <ellipse cx="200" cy="248" rx="89" ry="76" fill="#FFFFFF" />

    <!-- Little Cute "X" Mouth -->
    <path d="M 194 294 L 206 304 M 206 294 L 194 304" stroke="#F7ADC7" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
